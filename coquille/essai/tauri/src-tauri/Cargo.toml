[package]
name = "vocabulaire"
version = "4.1.0"
description = "Vocabulaire — application Windows"
authors = ["Franck VARAULT"]
edition = "2021"

[lib]
name = "vocabulaire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
minisign-verify = "0.3"   # signature des mises à jour
base64 = "0.23"
percent-encoding = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
